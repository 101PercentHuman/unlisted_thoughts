baseURL: "https://unlistedthoughts.com"
title: "Unlisted Thoughts Incorporated"
languageCode: "en-us"

module:
  imports:
    disable: false
    ignoreConfig: false
    ignoreImports: false
    path: "github.com/theNewDynamic/gohugo-theme-ananke/v2"

outputs:
  home: ["HTML"]
  page: ["HTML"]
  section: ["HTML"]
  taxonomy: ["HTML"]
  term: ["HTML"]

params:
  logo: "/images/logo_inc.svg"
  logo_text: "Unlisted Thoughts Inc."
  favicon: "favicon.ico"
  date_format: "2 January 2006"
  custom_css:
    - "css/custom.css"
    - "css/custom2.css"
    - "css/scroll-banner.css"
    - "css/custom-cursor.css"
    
  ananke:
    home:
      content_alignment: "left"
    page:
      content_alignment: "left"
    taxonomy:
      content_alignment: "left"
    summary:
      content_alignment: "left"
    list:
      content_alignment: "left"

menu:
  main:
    - name: FOI
      url: "/foi/"
      weight: 2
    - name: Heraldry
      url: "/heraldry/"
      weight: 3
    - name: Flags
      url: "/flags/"
      weight: 4
    - name: Posts
      url: "/posts/"
      weight: 5
    - name: About
      url: "/about/"
      weight: 6
    - name: Resources
      url: "/resources/"
      weight: 7  
    - name: Contact
      url: "/contact/"
      weight: 8

markup:
  goldmark:
    parser:
      attribute:
        block: true
    renderer:
      unsafe: true
